# =====================================================================
# HChat 一键启动：docker compose -f deploy/docker-compose.yml up --build
#
#   server      http://localhost:8080        （REST / WS / SSE / 文件）
#   playground  http://localhost:8000        （本地体验页）
#   embed       http://localhost:8081        （iframe 嵌入页）
#   mysql       localhost:3306
#   redis       localhost:6379   → --profile redis
#   minio       localhost:9000   → --profile minio
# =====================================================================

name: hchat

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hchat}
      MYSQL_USER: ${DATABASE_USERNAME:-hchat}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-hchat}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 8s
      timeout: 5s
      retries: 20
      start_period: 30s

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      DEV_MODE: ${DEV_MODE:-true}
      WORKER_ID: ${WORKER_ID:-1}
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hchat}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DATABASE_USERNAME: ${DATABASE_USERNAME:-hchat}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hchat}
      JWT_SECRET: ${JWT_SECRET:-hchat-compose-demo-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:8081,http://localhost:5173,http://localhost:5174}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/.data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TZ: UTC
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - uploads:/app/.data

  playground:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: playground
        VITE_HCHAT_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
        VITE_HCHAT_APP_ID: ${DEMO_APP_ID:-app_demo}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "${PLAYGROUND_PORT:-8000}:80"

  embed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: embed
    restart: unless-stopped
    ports:
      - "${EMBED_PORT:-8081}:80"

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  uploads:
  redis-data:
  minio-data:

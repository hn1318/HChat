name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runner 在境外：项目 .npmrc 里的 npmmirror 偶发 500，会让 pnpm/action-setup
  # 的自安装器和 pnpm install 一起失败。显式覆盖成官方源，本地 .npmrc 不受影响。
  # npm_config_registry 作用于 npm CLI（action-setup 用它装 pnpm）；
  # PNPM_CONFIG_REGISTRY 作用于 pnpm CLI（pnpm 12 不认 npm_config_registry）。
  npm_config_registry: https://registry.npmjs.org/
  PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  server:
    name: Server (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers 需要 Docker，GitHub 托管 runner 默认可用
      - name: Unit + integration tests (H2 + Testcontainers MySQL)
        working-directory: server
        run: mvn -B verify -Pit

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports/**
          if-no-files-found: ignore

  web:
    name: Web (pnpm monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本取根 package.json 的 "packageManager": "pnpm@12.6.0"（唯一来源）。
      # 不要在此写 with.version，否则 action-setup 会报 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 发布契约：元信息齐全 + 真打一次 tarball 校验内容（不需要 npm token）
      - name: Release metadata check
        run: pnpm release:prepare && node scripts/release-check.mjs

      - name: Pack check
        run: pnpm release:pack

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [server, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: hchat/server:ci

      - name: Build playground image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          build-args: |
            APP=playground
          tags: hchat/playground:ci

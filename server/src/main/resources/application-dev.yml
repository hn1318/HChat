spring:
  datasource:
    # 本地开发默认用嵌入式 H2（MySQL 兼容模式），零外部依赖即可启动
    url: jdbc:h2:file:./.data/hchat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration,classpath:db/seed

hchat:
  dev-mode: true
  storage:
    local-dir: ./.data/uploads

logging:
  level:
    com.hchat: DEBUG
    org.springframework.web.socket: INFO

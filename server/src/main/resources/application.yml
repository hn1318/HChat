server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: hchat-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/hchat?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DATABASE_USERNAME:hchat}
    password: ${DATABASE_PASSWORD:hchat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 10000
      pool-name: hchat-pool
  flyway:
    enabled: true
    # 需要演示数据时把 db/seed 一起加上：classpath:db/migration,classpath:db/seed
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:24MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    async:
      request-timeout: 180000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/swagger-ui.html
    disable-swagger-default-url: true

hchat:
  default-tenant-id: ${DEFAULT_TENANT_ID:default}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  dev-mode: ${DEV_MODE:false}
  worker-id: ${WORKER_ID:0}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:hchat-dev-secret-please-change-me-32bytes}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
    issuer: ${JWT_ISSUER:hchat}
  storage:
    driver: ${STORAGE_DRIVER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./.data/uploads}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-bucket: ${S3_BUCKET:hchat}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    s3-region: ${S3_REGION:us-east-1}
    s3-path-style: ${S3_PATH_STYLE:true}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:1024}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  limits:
    enabled: ${RATE_LIMIT_ENABLED:true}
    ip-rps: ${RATE_LIMIT_IP_RPS:60}
    user-rps: ${RATE_LIMIT_USER_RPS:30}
    app-rps: ${RATE_LIMIT_APP_RPS:300}
    burst: ${RATE_LIMIT_BURST:2}
    max-message-length: ${MAX_MESSAGE_LENGTH:4000}
    recall-window-seconds: ${RECALL_WINDOW_SECONDS:120}
    default-page-size: ${DEFAULT_PAGE_SIZE:20}
    max-page-size: ${MAX_PAGE_SIZE:100}
    max-file-bytes: ${MAX_FILE_BYTES:20971520}
  webhook:
    timeout-seconds: ${WEBHOOK_TIMEOUT_SECONDS:10}
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${WEBHOOK_INITIAL_BACKOFF_MS:1000}
    max-age-seconds: ${WEBHOOK_MAX_AGE_SECONDS:300}
  redis:
    enabled: ${REDIS_ENABLED:false}
    url: ${REDIS_URL:}

logging:
  level:
    root: INFO
    com.hchat: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
